name: Workflow dispatch inputs and security verification

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        description: Input your message
      lang-selector:
        type: choice
        description: Choose your language
        options:
          - English
          - Norsk

jobs:
#  hello-message-job:
#    name: Hello message (job)
#    runs-on: ubuntu-latest
#    steps:
#      - name: Print message to terminal (step)
#        run: echo "Hello ${{ inputs.message }}!"

  hello-english-job:
    runs-on: ubuntu-latest
    if: inputs.lang-selector == 'English'
    name: Hello-english-🇬🇧-job
    steps:
      - name: print-english-step
        run: echo "Hello ${MESSAGE} 🇬🇧"
        env:
          MESSAGE: ${{ inputs.message }}

  hello_norsk_job:
    runs-on: ubuntu-latest
    if: inputs.lang-selector == 'Norsk'
    name: Hei-norsk-🇳🇴-job
    steps:
      - name: print-norsk-step
        env:
          MESSAGE: ${{ inputs.message }}
        run: echo "Hei ${MESSAGE} 🇳🇴"
